# ============================================================================
# Nginx config za outreach (out.buster.rs)
# ----------------------------------------------------------------------------
# Instalacija:
#   sudo cp deploy/nginx-out.buster.rs.conf /etc/nginx/sites-available/outreach
#   sudo ln -s /etc/nginx/sites-available/outreach /etc/nginx/sites-enabled/outreach
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d out.buster.rs
#
# Objašnjenje:
#   - gui-astro sluša SAMO na 127.0.0.1:3000 (vidi docker-compose.vps.yml)
#   - Nginx je sistemski reverse proxy sa 80/443 na tu adresu
#   - AUTH_TRUST_HOST=true u compose env već je postavljen
# ============================================================================

# HTTP server — preusmeri na HTTPS, ALI dozvoli ACME challenge za Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name out.buster.rs;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Sve ostalo → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — reverse proxy na gui-astro
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name out.buster.rs;

    # PLACEHOLDER: self-signed cert (generisan u /tmp) da nginx -t prođe PRE certbot-a.
    # `certbot --nginx` će automatski zameniti ove linije pravim Let's Encrypt
    # sertifikatom na /etc/letsencrypt/live/out.buster.rs/.
    ssl_certificate     /tmp/out.buster.rs.crt;
    ssl_certificate_key /tmp/out.buster.rs.key;

    # Sigurnosni headeri
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Upload limit (screenshots, CSV imports)
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Reverse proxy → gui-astro (port 3000, loopback)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Worker / IMAP poll imaju dugačke konekcije
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}