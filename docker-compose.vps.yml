# ============================================================================
# Outreach — VPS deployment (oba scrapera, profiles za selektivno paljenje)
# ----------------------------------------------------------------------------
# Baza živi na hostu u $OUTREACH_DATA_DIR (default ~/outreach-data/).
#
# Profili (default uključuje OBA):
#   docker compose -f docker-compose.vps.yml --env-file .env up -d
#     → gui-astro + scraper + scraper-leads
#
# Samo cold outreach (BEZ scraper-leads):
#   docker compose -f docker-compose.vps.yml --env-file .env \
#                  --profile outreach up -d
#
# Samo lead generation (BEZ scraper-a):
#   docker compose -f docker-compose.vps.yml --env-file .env \
#                  --profile leadgen up -d
#
# Reverse proxy (Caddy/Nginx) radi SISTEMSKI na hostu, NE u compose-u.
# gui-astro je izložen samo na 127.0.0.1:3000 — proxy treba da gleda tu.
# ============================================================================

services:
  gui-astro:
    build:
      context: ./gui-astro
      dockerfile: Dockerfile
    image: outreach-gui-astro:latest
    container_name: outreach-gui-astro
    restart: unless-stopped

    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/data/outreach.db
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8001}
      SCRAPER_LEADS_URL: ${SCRAPER_LEADS_URL:-http://scraper-leads:8002}
      AUTH_TRUST_HOST: "true"

    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - ${OUTREACH_DATA_DIR:?OUTREACH_DATA_DIR mora biti apsolutna putanja u .env}:/data

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      scraper:
        condition: service_started
        required: false
      scraper-leads:
        condition: service_healthy
        required: false

    networks: [outreach]

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  scraper:
    profiles: ["default", "outreach"]
    build:
      context: ./scraper
      dockerfile: Dockerfile
    image: outreach-scraper:latest
    container_name: outreach-scraper
    restart: unless-stopped

    env_file: .env
    environment:
      DATABASE_PATH: /data/outreach.db
      MAX_PAGES_PER_LEAD: "30"

    volumes:
      - ${OUTREACH_DATA_DIR}:/data

    networks: [outreach]

  scraper-leads:
    profiles: ["default", "leadgen"]
    build:
      context: ./scraper-leads
      dockerfile: Dockerfile
    image: outreach-scraper-leads:latest
    container_name: outreach-scraper-leads
    restart: unless-stopped

    env_file: .env
    environment:
      RUNS_DIR: /data/scraper-runs
      JOB_TIMEOUT_SEC: "900"

    volumes:
      - ${OUTREACH_DATA_DIR}:/data

    networks: [outreach]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8002/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  outreach:
    driver: bridge