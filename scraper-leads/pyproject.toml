[project]
name = "maps-cold-calling"
version = "0.2.0"
description = "Scrape Google Maps (and other sources) for (category, city) → business leads with phone/website/email for cold outreach"
readme = "README.md"
authors = [
    { name = "Djordje", email = "djveljkovic3019rn@raf.rs" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.34",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "rich>=15.0.0",
    "selectolax>=0.4.10",
    "tenacity>=9.1.4",
    "uvicorn>=0.32.0",
]

[project.scripts]
maps-cold-calling = "maps_cold_calling.cli:main"
maps-cold-calling-audit = "maps_cold_calling.audit.cli:main"
maps-cold-calling-api = "maps_cold_calling.api:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
] 
